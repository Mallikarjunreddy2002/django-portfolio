{% extends "base.html" %}
{% block content %}
<section>
    <div class="container">
        <h2 class="section-title">{{ title }}</h2>
        <form method="post" class="col-lg-6">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name</label>
                {{ form.name }}
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                {{ form.category }}
            </div>
            <div class="mb-3">
                <label class="form-label">Proficiency (%)</label>
                {{ form.proficiency }}
            </div>
            <div class="mb-3">
                <label class="form-label">Icon Class (optional, Bootstrap Icons)</label>
                {{ form.icon_class }}
            </div>
            <div class="mb-3">
                <label class="form-label">Order</label>
                {{ form.order }}
            </div>
            <button type="submit" class="btn btn-accent">Save Skill</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
