{% extends "base.html" %}
{% block content %}
<section>
    <div class="container">
        <h2 class="section-title">Edit My Profile</h2>
        <form method="post" enctype="multipart/form-data" class="col-lg-8">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.name == 'photo' and field.value %}
                <div class="mt-2"><img src="{{ field.value.url }}" style="max-height:100px; border-radius:50%;"></div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-accent">Save Profile</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
